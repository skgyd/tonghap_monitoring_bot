<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incident Bridge · SQLite 조회</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#20384b;font:14px 'Noto Sans CJK KR','Malgun Gothic',sans-serif}header{background:#173a50;color:#fff;padding:24px 36px;display:flex;align-items:center;justify-content:space-between}header small{letter-spacing:2px;color:#afc8d7}h1{font-size:27px;margin:6px 0}a{color:inherit;text-decoration:none}main{padding:28px 36px}section{background:#fff;border:1px solid #d4e0e8;border-radius:8px;padding:24px;margin-bottom:20px}.tools{display:flex;gap:14px;align-items:center}select,input,button{font:inherit;padding:11px 18px;border-radius:5px;border:1px solid #b3c7d3}select{min-width:300px}button{background:#1477a0;color:white;border:0;cursor:pointer}#login{display:none}.pill{background:#e0f2ed;color:#177259;border-radius:24px;padding:7px 13px;margin-left:12px;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#102b3c;color:#d2edf5;padding:24px;font:16px/1.9 Consolas,monospace;border-radius:6px;margin:18px 0 0}#info{color:#557184;font-size:12px}h2{font-size:17px;margin:0 0 15px}.result{padding:0;overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font:13px/1.6 Consolas,'Malgun Gothic',monospace}th{text-align:left;background:#dfe9ef;color:#284e67;font-weight:600;position:sticky;top:0}td,th{padding:15px 14px;border-bottom:1px solid #dce5eb;white-space:nowrap}tr:nth-child(even){background:#f6f9fb}.success{color:#087752;font-weight:bold}#summary{display:flex;justify-content:space-between;margin:20px 2px 12px}#error{color:#b32838}footer{color:#597485;padding:0 38px 25px;font-size:12px}
</style><header><div><small>INCIDENT BRIDGE / SQL EXPLORER</small><h1>SQLite 테이블 조회</h1></div><a href="/">← 관제 현황</a></header><main><section id="login"><p>시연 계정으로 로그인하면 연결됩니다. 세션이 만료되면 <a href="/login">다시 로그인</a>하세요.</p><input id="token" type="password" placeholder="관리 토큰"><button id="connect">연결</button></section><section><div class="tools"><select id="query"><option value="incidents">사건 · incidents</option><option value="deliveries">전송 · deliveries</option><option value="actions">처리 이력 · actions</option><option value="routes">업무별 채널 · routes</option><option value="verification">송수신 결과 대조 · JOIN</option><option value="activity_mirrors">답글·이모지 동기화</option><option value="tables">전체 테이블 · sqlite_master</option><option value="captures">captures</option><option value="collector_state">collector_state</option><option value="notifications">notifications</option><option value="meta">meta</option></select><button id="execute">SELECT 실행</button><span class="pill">READ ONLY</span></div><pre id="sql">연결 후 조회할 테이블을 선택하세요.</pre></section><div id="summary"><b id="count">조회 대기</b><span id="info"></span></div><section class="result"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></section><p id="error" role="alert"></p></main><footer>실제 SQLite 연결 · 프로그램에서 승인된 SELECT 문 실행 · 최대 200행 · UTC 시각 / 캡처 이미지 파일은 데이터 폴더에 보관합니다.</footer><script>
if(location.hash.startsWith('#token=')){sessionStorage.setItem('bridgeToken',location.hash.slice(7));history.replaceState(null,'',location.pathname)}
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('bridgeToken')||'';
function cell(tag,text){const e=document.createElement(tag);e.textContent=text===true?'true':text===false?'false':String(text??'');if(['COMPLETED','SENT'].includes(text))e.className='success';return e}
async function run(){try{$('execute').disabled=true;$('error').textContent='';const r=await fetch('/api/db/'+$('query').value,{headers:{'X-Bridge-Token':token}});const data=await r.json();if(!r.ok){if(r.status===403)$('login').style.display='block';throw Error(data.error||r.status)}$('login').style.display='none';$('sql').textContent=data.sql.replace(/ FROM /g,'\nFROM ').replace(/ WHERE /g,'\nWHERE ').replace(/ ORDER BY /g,'\nORDER BY ');$('columns').replaceChildren();const h=document.createElement('tr');data.columns.forEach(v=>h.append(cell('th',v)));$('columns').append(h);$('rows').replaceChildren();data.rows.forEach(values=>{const tr=document.createElement('tr');values.forEach(v=>tr.append(cell('td',v)));$('rows').append(tr)});$('count').textContent=data.row_count+' rows · 조회 완료';$('info').textContent=data.engine+' / '+data.database+' / '+data.queried_at;document.body.dataset.queryDone=$('query').value;}catch(e){$('error').textContent=e.message}finally{$('execute').disabled=false}}
$('execute').onclick=run;$('connect').onclick=()=>{token=$('token').value;sessionStorage.setItem('bridgeToken',token);run()};
(async()=>{if(!token){try{const r=await fetch('/launch-info');if(r.ok){token=(await r.json()).admin_token;sessionStorage.setItem('bridgeToken',token)}}catch(e){}}run()})();
</script></html>
