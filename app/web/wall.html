<!doctype html><html lang="ko"><meta charset="utf-8"><title>통합 관제 재현 시연</title><style>body{margin:0;background:#172c37;font-family:sans-serif}header{height:56px;display:flex;align-items:center;justify-content:space-between;color:white;padding:0 24px}main{display:flex;height:calc(100vh - 56px);gap:5px}iframe{width:50%;border:0;background:#fff}small{color:#bdced7}button,a{padding:8px 12px;border:0;border-radius:5px;background:#e4b25d;color:#172c37;cursor:pointer;text-decoration:none;font-size:12px}#notice{position:fixed;bottom:12px;left:16px;background:#163a49;color:white;padding:12px;border-radius:6px;z-index:20}</style><header><a href="/welcome">시연 홈</a><b>INCIDENT BRIDGE　/　공모전 웹 시연</b><span><button data-source="polestar">기업회계 오류 발생</button> <button data-source="jobpass">금융거래 오류 발생</button> <a href="/" target="_blank">관제 관리</a> <a href="/sql" target="_blank">SQL 조회</a> <a id="mm-link" href="/welcome" target="_blank">Mattermost</a></span><small id="mode">시연 모드 확인 중</small></header><main><iframe src="/mock/polestar"></iframe><iframe src="/mock/jobpass"></iframe></main></html>
<div id="notice">가상 오류를 생성하면 실제 Mattermost 업무 채널로 전송합니다.</div><script>
if(location.hash.startsWith('#token=')){sessionStorage.setItem('bridgeToken',location.hash.slice(7));history.replaceState(null,'',location.pathname)}
let token=sessionStorage.getItem('bridgeToken')||'';fetch('/session').then(r=>r.json()).then(s=>{document.querySelector('#mm-link').href=s.mattermost_url}).catch(()=>{});
document.querySelectorAll('a[href="/"],a[href="/sql"]').forEach(a=>a.href=a.getAttribute('href')+'#token='+token);
async function getToken(){if(token)return token;try{const r=await fetch('/launch-info');if(r.ok){const info=await r.json();token=info.admin_token;sessionStorage.setItem('bridgeToken',token);return token;}}catch(e){}token=prompt('관리 토큰을 입력하세요')||'';return token;}
fetch('/api/state',{headers:{'X-Bridge-Token':token}}).then(r=>r.json()).then(s=>{document.querySelector('#mode').textContent=s.mode==='live'?'실제 Mattermost 송수신 · 가상 오류':'모의 메신저 시연 · 실제 Mattermost 아님';document.querySelector('#notice').textContent='오류 발생 버튼 → 캡처 → 업무별 채널 → 접수/완료 → SQL 조회 순서로 진행하세요.';if(s.mode!=='live'){const a=document.querySelector('#mm-link');a.href='/#token='+token;a.textContent='모의 메신저'}});
document.querySelectorAll('[data-source]').forEach(b=>b.onclick=async()=>{const t=await getToken();if(!t)return;const r=await fetch('/api/demo/add',{method:'POST',headers:{'Content-Type':'application/json','X-Bridge-Token':t},body:JSON.stringify({source:b.dataset.source,direct:false})});document.querySelector('#notice').textContent=r.ok?'오류 생성됨 → 화면 수집·캡처 → 선택한 시연 모드의 업무 채널로 전송 중':JSON.stringify(await r.json());});
</script>
