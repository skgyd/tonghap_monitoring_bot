<!doctype html><html lang="ko"><meta charset="utf-8"><title>모의 에러 화면</title><style>body{font:16px 'Malgun Gothic',sans-serif;background:#eaf0f5;padding:30px}table{background:white;width:100%;border-collapse:collapse}td,th{padding:16px;border-bottom:1px solid #ddd}button{padding:8px 16px}#popup{position:fixed;inset:10% 8%;background:white;box-shadow:0 0 0 100vw #0005;padding:25px;border:3px solid #345;overflow:auto}#flow{display:flex;align-items:center;gap:25px;padding:60px 20px;background:#f7fafc}.node{padding:24px;border:2px solid #788;border-radius:10px}.error{border-color:#c43;background:#ffe6e4}h1{font-size:22px}#popup[hidden]{display:none}</style><h1>모의 화면 — 실제 잡패스·폴스타 제품이 아닙니다</h1><p>관제 브릿지에서 에러를 생성하면 목록에 표시됩니다. 잡패스 오류 행을 더블클릭해 상세 화면을 확인하세요.</p><div id="ready"><h2 id="section-title">알람 목록</h2><table><thead><tr><th>발생 ID</th><th>잡 이름</th><th>에러</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="popup" hidden><h2>Component · 모의 잡 구성도</h2><p>실행 ID: <b id="detail-id"></b></p><div id="flow"><div class="node">시작</div>→<div class="node">파일 확인</div>→<div class="node error" id="error-node">SQL 실행 실패</div>→<div class="node">종료</div></div><div id="execution-log"><h3>실행로그</h3><pre>JOB START
Task result: ERROR
모의 오류: 연결 시간 초과</pre></div><button id="close">닫기</button></div><script>
const source=location.pathname.split('/').pop(),rows=document.getElementById('rows'),popup=document.getElementById('popup');
function cell(t,cls){const e=document.createElement('td');e.textContent=t;e.className=cls;return e;}
async function refresh(){const data=await(await fetch('/mock-data/'+source)).json();rows.replaceChildren();for(const i of data){const tr=document.createElement('tr');tr.dataset.eventId=i.event_id;tr.append(cell(i.event_id,'event'),cell(i.job_name,'job'),cell(i.message,'message'));const td=document.createElement('td'),b=document.createElement('button');b.textContent='상세';b.className='detail';const openDetail=()=>{document.getElementById('detail-id').textContent=i.event_id;popup.hidden=false;}; if(source==='jobpass'){tr.ondblclick=openDetail;b.textContent='더블클릭';}else{b.onclick=openDetail;}td.append(b);tr.append(td);rows.append(tr);}}document.getElementById('close').onclick=()=>popup.hidden=true;document.getElementById('section-title').textContent=source==='jobpass'?'실행오류 (수집 대상)':'알람콘솔'; if(source==='jobpass'){const other=document.createElement('section');other.innerHTML='<h2>실행중 (수집 제외 영역)</h2><table><tr><td>RUNNING_DEMO</td></tr></table>';document.body.insertBefore(other,document.getElementById('ready'));} refresh();setInterval(refresh,3000);
</script></html>
